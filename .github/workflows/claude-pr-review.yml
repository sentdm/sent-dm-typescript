name: Claude PR Review

# Reviews pull requests against REVIEW.md and CLAUDE.md. Skips the bots' own
# PRs (release-please, the SDK pipeline) and PRs from forks, which get no
# secrets. Needs the ANTHROPIC_API_KEY secret. Without it the steps are
# skipped rather than failed, so a missing key never blocks a merge.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'sentdmdevops' &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'stl-preview-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Checkout code
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Claude Code Review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review this pull request following REVIEW.md and CLAUDE.md in the
            repository root. Report only what REVIEW.md asks for, as inline
            comments where a line is at fault, plus a short summary. If a
            commit in the PR carries a Stainless-Generated-From trailer,
            review the public surface it changes and its commit subject, not
            the generated lines. If you find nothing, say "No issues found".
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
