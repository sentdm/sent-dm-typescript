# Keeps the lockfile and the pinned GitHub Actions current. Lockfile-only, so
# the manifest the generator writes is never edited, and grouped monthly so
# the result is one pull request per ecosystem. The ci(deps) prefix keeps the
# commits out of the changelog and cuts no release. Majors are left to a
# person: a major of a dev tool has broken lint here before, and the release
# workflows these pins live in never run on a pull request. Security updates
# are not affected by the ignore rules.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    versioning-strategy: 'lockfile-only'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      lockfile:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
    open-pull-requests-limit: 2
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
    open-pull-requests-limit: 2
